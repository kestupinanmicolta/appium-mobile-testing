name: Test & Deploy Report
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Clone FlowersApp
        run: git clone https://github.com/kestupinanmicolta/FlowersApp.git /tmp/FlowersApp

      - name: Build FlowersApp APK
        working-directory: /tmp/FlowersApp
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create AVD
        run: |
          sdkmanager "system-images;android-28;google_apis;x86_64"
          echo "no" | avdmanager create avd -n test_avd -k "system-images;android-28;google_apis;x86_64" --force

      - name: Start Emulator
        run: |
          nohup emulator -avd test_avd -no-window -no-audio -gpu swiftshader_indirect -no-boot-anim -no-snapshot -memory 2048 &
          echo "Emulator starting..."
          
          # Wait for boot
          for i in $(seq 1 60); do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$BOOT" = "1" ]; then
              echo "Boot completed after ${i}s"
              break
            fi
            echo "Waiting for boot... ${i}s"
            sleep 5
          done
          
          adb wait-for-device
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          echo "Emulator ready"

      - name: Install APK
        run: |
          adb install /tmp/FlowersApp/app/build/outputs/apk/debug/app-debug.apk
          adb shell am start -n com.flowersapp/.ui.LoginActivity
          sleep 5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and Start Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2
          appium --port 4723 &
          sleep 15
          echo "Appium started"

      - name: Run Tests
        continue-on-error: true
        run: mvn clean test -f pom.xml

      - name: Generate Allure Report
        if: always()
        run: |
          npm install -g allure-commandline
          mkdir -p public
          if [ -d target/allure-results ] && [ "$(ls -A target/allure-results 2>/dev/null)" ]; then
            allure generate target/allure-results --clean -o public || true
          fi
          if [ ! -f public/index.html ]; then
            cat > public/index.html << 'EOF'
          <!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
          <title>Appium Mobile Testing Report</title>
          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
          <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
          <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;background:#f1f5f9;color:#1e293b}
          .header{background:linear-gradient(135deg,#0f172a,#1e3a5f);color:white;padding:2rem;text-align:center}
          .header h1{font-size:1.5rem}.header p{color:#60a5fa;margin-top:.25rem}
          .container{max-width:800px;margin:2rem auto;padding:0 1rem}
          .card{background:white;border-radius:12px;padding:1.5rem;margin-bottom:1rem;box-shadow:0 2px 8px rgba(0,0,0,.08)}
          .card h2{font-size:1rem;margin-bottom:.75rem;color:#0f172a}
          .features{list-style:none}.features li{padding:.4rem 0;font-size:.85rem;color:#475569;display:flex;align-items:center;gap:.5rem}
          .features li i{color:#10b981;font-size:.7rem}
          .btn{display:inline-flex;align-items:center;gap:.5rem;background:#0f172a;color:white;padding:.6rem 1.2rem;border-radius:8px;text-decoration:none;font-weight:600;font-size:.85rem;margin-top:.5rem}
          .footer{text-align:center;padding:1.5rem;font-size:.75rem;color:#94a3b8}</style></head><body>
          <div class="header"><h1><i class="fas fa-mobile-alt"></i> Appium Mobile Testing</h1><p>Android Emulator Tests — FlowersApp</p></div>
          <div class="container">
          <div class="card"><h2><i class="fas fa-info-circle"></i> Test Execution</h2>
          <p style="font-size:.85rem;color:#475569">Tests executed on Android emulator (API 28, Google APIs, x86_64) with Appium UiAutomator2.</p></div>
          <div class="card"><h2><i class="fas fa-check-circle"></i> Test Coverage</h2>
          <ul class="features">
            <li><i class="fas fa-check"></i> Login - Successful and failed authentication</li>
            <li><i class="fas fa-check"></i> Catalog - Product listing and search</li>
            <li><i class="fas fa-check"></i> Cart - Add/remove products, checkout flow</li>
          </ul></div>
          <a href="https://github.com/kestupinanmicolta/appium-mobile-testing" class="btn"><i class="fab fa-github"></i> View Source Code</a>
          </div><div class="footer">2026 Karen Paola Estupinan Micolta</div></body></html>
          EOF
          fi

      - name: Stop Emulator
        if: always()
        run: adb emu kill 2>/dev/null || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
