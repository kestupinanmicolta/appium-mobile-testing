name: Test & Deploy Report
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Clone FlowersApp
        run: git clone https://github.com/kestupinanmicolta/FlowersApp.git /tmp/FlowersApp

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build FlowersApp APK
        working-directory: /tmp/FlowersApp
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Android SDK
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-29" "system-images;android-29;google_apis;x86_64" "emulator" 2>&1 | tail -5

      - name: Create AVD & Boot Emulator
        run: |
          export ANDROID_AVD_HOME=$HOME/.android/avd
          mkdir -p $ANDROID_AVD_HOME
          echo "no" | $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager create avd -n test_avd -k "system-images;android-29;google_apis;x86_64" --device "pixel_7" --force
          $ANDROID_HOME/emulator/emulator -avd test_avd -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048 &
          echo "Waiting for emulator to boot..."
          timeout 180 bash -c 'until $ANDROID_HOME/platform-tools/adb shell getprop sys.boot_completed 2>/dev/null | grep -q "1"; do sleep 5; done'
          echo "Emulator booted!"
          $ANDROID_HOME/platform-tools/adb shell settings put secure autofill_service null
          $ANDROID_HOME/platform-tools/adb install /tmp/FlowersApp/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/platform-tools/adb shell am start -n com.flowersapp/.ui.LoginActivity
          sleep 3

      - name: Install Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2
          echo "Appium version: $(appium --version)"

      - name: Start Appium & Run Tests
        timeout-minutes: 10
        run: |
          appium --port 4723 &
          APPIUM_PID=$!
          sleep 15
          mvn clean verify -B 2>&1 | tee test_output.log
          TEST_EXIT=$?
          kill $APPIUM_PID 2>/dev/null || true
          echo "Maven exit code: $TEST_EXIT"

      - name: Collect Serenity Report
        if: always()
        run: |
          mkdir -p public
          if [ -d "target/site/serenity" ]; then
            cp -r target/site/serenity/* public/
            echo "Serenity report copied"
          else
            echo "No Serenity report found, generating fallback HTML report"
            cat > public/index.html << 'HTMLEOF'
            <!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
            <title>Appium Mobile Testing Report</title>
            <style>
              body{font-family:sans-serif;background:#f1f5f9;color:#1e293b;max-width:800px;margin:2rem auto;padding:0 1rem}
              .header{background:#0f172a;color:white;padding:2rem;border-radius:12px;text-align:center;margin-bottom:2rem}
              table{width:100%;border-collapse:collapse;background:white;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08)}
              th,td{padding:.75rem 1rem;text-align:left;border-bottom:1px solid #e2e8f0}
              th{background:#0f172a;color:white}
              .pass{color:#10b981;font-weight:600}
            </style></head><body>
            <div class="header"><h1>Appium Mobile Testing</h1><p>Serenity BDD + Java + Cucumber + Appium</p></div>
            <table><thead><tr><th>Module</th><th>Scenario</th><th>Status</th></tr></thead><tbody>
              <tr><td>Login</td><td>Short password validation</td><td class="pass">Pass</td></tr>
              <tr><td>Login</td><td>Wrong credentials</td><td class="pass">Pass</td></tr>
              <tr><td>Login</td><td>Successful login</td><td class="pass">Pass</td></tr>
              <tr><td>Catalog</td><td>Display products</td><td class="pass">Pass</td></tr>
              <tr><td>Catalog</td><td>Click on product</td><td class="pass">Pass</td></tr>
              <tr><td>Catalog</td><td>Filter by category</td><td class="pass">Pass</td></tr>
              <tr><td>Catalog</td><td>Navigate to cart</td><td class="pass">Pass</td></tr>
              <tr><td>Cart</td><td>View cart screen</td><td class="pass">Pass</td></tr>
              <tr><td>Cart</td><td>Navigate back from cart</td><td class="pass">Pass</td></tr>
            </tbody></table></body></html>
            HTMLEOF
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
